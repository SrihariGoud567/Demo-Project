<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Two Numbers</title>
</head>
<body>
    
<h2>Add Two Numbers</h2>

<from method="POST">
    {% csrf_token %}
    {{form.as_p}}

</from>

{% if result is not none %}
<h3>Result:{{ result }}</h3>
{%endif%}

</body>
</html>
