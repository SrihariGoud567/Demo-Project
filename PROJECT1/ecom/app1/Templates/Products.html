<!DOCTYPE html>
<html>
<head>
    <title>Categories</title>
    <style>
        .card {
            width: 200px;
            border: 1px solid #ddd;
            padding: 10px;
            margin: 10px;
            text-align: center;
            display: inline-block;
        }

        img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }
    </style>
</head>
<body>

<h2>All Categories</h2>

{% for cat in categories %}
    <div class="card">
        {% if cat.Image %}
        <a href="http://127.0.0.1:8000/product_details/{{cat.id}}">
            <img src="{{ cat.Image.url }}">
        </a>
        {% else %}
            <p>No Image</p>
        {% endif %}
        <h3>{{ cat.name }}</h3>
    </div>
{% endfor %}

</body>
</html>
